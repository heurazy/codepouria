name: Build Immersive Portals Client 26.2 alpha.8 Lunar
on:
  push:
    branches:
      - build/immersive-portals-client-26.2
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Restore alpha.7 sources
        working-directory: immersive-portals-client
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/ipc-a7 /tmp/ipc-a7-src
          mkdir -p /tmp/ipc-a7 /tmp/ipc-a7-src
          gh run download 33213716132 --repo heurazy/codepouria -n immersive-portals-client-26.2-alpha.7-lunar -D /tmp/ipc-a7
          SRC=$(find /tmp/ipc-a7 -maxdepth 1 -type f -name '*-sources.jar' | head -n 1)
          test -n "$SRC"
          unzip -q "$SRC" -d /tmp/ipc-a7-src
          rm -rf src/client/java src/main/resources
          mkdir -p src/client/java src/main/resources
          cp -R /tmp/ipc-a7-src/dev src/client/java/
          cp -R /tmp/ipc-a7-src/assets src/main/resources/
          cp /tmp/ipc-a7-src/fabric.mod.json src/main/resources/fabric.mod.json
          cp /tmp/ipc-a7-src/immersive_portals_client.accesswidener src/main/resources/immersive_portals_client.accesswidener
      - name: Fix paired portal side orientation
        working-directory: immersive-portals-client
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/client/java/dev/immersiveportalsclient/state/PortalMemory.java')
          s = p.read_text()

          old = '''            Vec3 captureOrigin = canFinalize ? destinationPortal.center() : playerPos;\n            SceneSnapshot scene = capture(level, captureOrigin, client.player.getYRot());\n            learn(pendingSource, canFinalize ? destinationPortal : null, scene);\n'''
          new = '''            Vec3 captureOrigin = canFinalize ? destinationPortal.center() : playerPos;\n            // Do not infer which side of a real portal the player emerged on from camera yaw.\n            // Vanilla preserves/rotates look direction independently from the actual exit side, which\n            // could make the cached world appear from the opposite side when viewed from Overworld.\n            float captureYaw = canFinalize\n                ? portalSideYaw(destinationPortal, playerPos, client.player.getYRot())\n                : client.player.getYRot();\n            SceneSnapshot scene = capture(level, captureOrigin, captureYaw);\n            learn(pendingSource, canFinalize ? destinationPortal : null, scene);\n'''
          if old not in s:
              raise SystemExit('arrival capture block not found')
          s = s.replace(old, new)

          old_remember = '''        SceneSnapshot snapshot = capture(level, frame.center(), yaw);\n        putObserved(frame, snapshot);\n        return snapshot;\n'''
          new_remember = '''        Vec3 observer = Minecraft.getInstance().player != null\n            ? Minecraft.getInstance().player.position()\n            : frame.center();\n        SceneSnapshot snapshot = capture(level, frame.center(), portalSideYaw(frame, observer, yaw));\n        putObserved(frame, snapshot);\n        return snapshot;\n'''
          count = s.count(old_remember)
          if count != 2:
              raise SystemExit(f'expected 2 observed capture blocks, got {count}')
          s = s.replace(old_remember, new_remember)

          marker = '''    private static void learn(PortalFrame source, PortalFrame destinationPortal, SceneSnapshot scene) {\n        learned.put(source, new LearnedDestination(source, destinationPortal, scene));\n    }\n\n'''
          helper = '''    private static void learn(PortalFrame source, PortalFrame destinationPortal, SceneSnapshot scene) {\n        learned.put(source, new LearnedDestination(source, destinationPortal, scene));\n    }\n\n    /**\n     * Encode the physical side of a vertical portal into the snapshot yaw used by the renderer.\n     * The renderer only needs the sign of the portal normal for paired vanilla openings. Using\n     * player position makes this independent from where the player happened to look while exiting.\n     */\n    private static float portalSideYaw(PortalFrame frame, Vec3 observer, float fallbackYaw) {\n        if (frame == null || frame.plane() == PortalFrame.Plane.HORIZONTAL) return fallbackYaw;\n\n        Vec3 center = frame.center();\n        return switch (frame.plane()) {\n            // Plane X is an XY opening: its normal axis is Z. destinationExitSign uses cos(yaw).\n            case X -> {\n                double side = observer.z - center.z;\n                if (Math.abs(side) < 0.05) yield fallbackYaw;\n                yield side > 0.0 ? 0.0f : 180.0f;\n            }\n            // Plane Z is a ZY opening: its normal axis is X. destinationExitSign uses -sin(yaw).\n            case Z -> {\n                double side = observer.x - center.x;\n                if (Math.abs(side) < 0.05) yield fallbackYaw;\n                yield side > 0.0 ? -90.0f : 90.0f;\n            }\n            case HORIZONTAL -> fallbackYaw;\n        };\n    }\n\n'''
          if marker not in s:
              raise SystemExit('learn marker not found')
          s = s.replace(marker, helper)
          p.write_text(s)
          PY
      - name: Prepare standalone Lunar build
        working-directory: immersive-portals-client
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          props = Path('gradle.properties')
          text = props.read_text()
          import re
          text = re.sub(r'^mod_version=.*$', 'mod_version=0.2.4-alpha.8', text, flags=re.M)
          props.write_text(text)

          gradle = Path('build.gradle')
          g = gradle.read_text()
          needle = '    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"\n'
          if 'include "net.fabricmc.fabric-api:fabric-api:' not in g:
              g = g.replace(needle, needle + '    include "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"\n')
          gradle.write_text(g)

          aw = Path('src/main/resources/immersive_portals_client.accesswidener')
          a = aw.read_text().replace('accessWidener v2 named', 'accessWidener v2 official')
          aw.write_text(a)

          mod = Path('src/main/resources/fabric.mod.json')
          data = json.loads(mod.read_text())
          data['description'] = 'Lunar-compatible standalone client-only Nether/End portal renderer for Fabric 26.2; per-portal snapshots with physical exit-side orientation.'
          data.get('depends', {}).pop('fabric-api', None)
          mod.write_text(json.dumps(data, indent=2) + '\n')
          PY
      - name: Build
        working-directory: immersive-portals-client
        run: gradle clean build --stacktrace
      - name: Verify
        working-directory: immersive-portals-client
        run: |
          JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)
          echo "Runtime JAR: $JAR"
          unzip -p "$JAR" fabric.mod.json
          echo '--- access widener ---'
          unzip -p "$JAR" immersive_portals_client.accesswidener | head -n 2
          sha256sum "$JAR"
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: immersive-portals-client-26.2-alpha.8-lunar
          path: immersive-portals-client/build/libs/*.jar
          if-no-files-found: error
