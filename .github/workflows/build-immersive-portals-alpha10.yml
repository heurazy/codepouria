name: Build Immersive Portals Client 26.2 alpha.10 Lunar
on:
  push:
    branches:
      - build/immersive-portals-client-26.2
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Restore alpha.9 source and apply alpha.10 patch
        working-directory: immersive-portals-client
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/ipc-a9 /tmp/ipc-a9-src
          mkdir -p /tmp/ipc-a9 /tmp/ipc-a9-src
          gh run download 33250726714 --repo heurazy/codepouria -n immersive-portals-client-26.2-alpha.9-lunar -D /tmp/ipc-a9
          SRC=$(find /tmp/ipc-a9 -maxdepth 1 -type f -name '*-sources.jar' | head -n 1)
          test -n "$SRC"
          unzip -q "$SRC" -d /tmp/ipc-a9-src
          rm -rf src/client/java src/main/resources
          mkdir -p src/client/java src/main/resources
          cp -R /tmp/ipc-a9-src/dev src/client/java/
          cp -R /tmp/ipc-a9-src/assets src/main/resources/
          cp /tmp/ipc-a9-src/fabric.mod.json src/main/resources/fabric.mod.json
          cp /tmp/ipc-a9-src/immersive_portals_client.accesswidener src/main/resources/immersive_portals_client.accesswidener
          patch -p0 < alpha10.patch
      - name: Prepare standalone Lunar build
        working-directory: immersive-portals-client
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          props = Path('gradle.properties')
          props.write_text(re.sub(r'^mod_version=.*$', 'mod_version=0.2.6-alpha.10', props.read_text(), flags=re.M))
          gradle = Path('build.gradle')
          g = gradle.read_text()
          needle = '    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"\n'
          if 'include "net.fabricmc.fabric-api:fabric-api:' not in g:
              g = g.replace(needle, needle + '    include "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"\n')
          gradle.write_text(g)
          aw = Path('src/main/resources/immersive_portals_client.accesswidener')
          aw.write_text(aw.read_text().replace('accessWidener v2 named', 'accessWidener v2 official'))
          mod = Path('src/main/resources/fabric.mod.json')
          data = json.loads(mod.read_text())
          data['description'] = 'Lunar-compatible client-only portal renderer with extended cached distance, partial-block safe surface culling and prepared-scene caching.'
          data.get('depends', {}).pop('fabric-api', None)
          mod.write_text(json.dumps(data, indent=2) + '\n')
          PY
      - name: Build
        working-directory: immersive-portals-client
        run: gradle clean build --stacktrace
      - name: Verify
        working-directory: immersive-portals-client
        run: |
          JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)
          echo "Runtime JAR: $JAR"
          unzip -p "$JAR" fabric.mod.json
          echo '--- access widener ---'
          unzip -p "$JAR" immersive_portals_client.accesswidener | head -n 2
          sha256sum "$JAR"
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: immersive-portals-client-26.2-alpha.10-lunar
          path: immersive-portals-client/build/libs/*.jar
          if-no-files-found: error
