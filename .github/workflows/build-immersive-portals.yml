name: Inspect Minecraft 26.2 collector APIs
on:
  push:
    branches:
      - build/immersive-portals-client-26.2
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Reconstruct source
        working-directory: immersive-portals-client
        run: |
          cat source-alpha4/part* | base64 -d > latest-alpha4.tar.xz
          tar -xJf latest-alpha4.tar.xz
      - name: Inspect
        working-directory: immersive-portals-client
        run: |
          cat >> build.gradle <<'EOF'
          tasks.register('dumpClientCp') { doLast { println sourceSets.client.compileClasspath.asPath } }
          EOF
          CP=$(gradle -q dumpClientCp | tail -n 1)
          for C in \
            net.minecraft.client.renderer.RenderPipelines \
            net.minecraft.client.renderer.SubmitNodeCollector \
            net.minecraft.client.renderer.OrderedSubmitNodeCollector \
            net.fabricmc.fabric.api.client.rendering.v1.level.LevelRenderContext; do
            echo "===== $C ====="
            javap -classpath "$CP" -p "$C" 2>&1 | head -260
          done
