name: Build Immersive Portals Client 26.2
on:
  push:
    branches:
      - build/immersive-portals-client-26.2
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Unpack latest client-only source
        working-directory: immersive-portals-client
        run: tar -xJf latest-src.tar.xz
      - name: Build Fabric mod
        working-directory: immersive-portals-client
        run: gradle clean build --stacktrace
      - name: Upload JARs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immersive-portals-client-26.2
          path: immersive-portals-client/build/libs/*.jar
          if-no-files-found: ignore
