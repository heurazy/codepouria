name: Build Immersive Portals Client 26.2 alpha.4
on:
  push:
    branches:
      - build/immersive-portals-client-26.2
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Reconstruct source
        working-directory: immersive-portals-client
        run: |
          cat source-alpha4/part* | base64 -d > latest-alpha4.tar.xz
          tar -xJf latest-alpha4.tar.xz
      - name: Patch renderer for Minecraft 26.2
        working-directory: immersive-portals-client
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/client/java/dev/immersiveportalsclient/render/PortalSurfaceRenderer.java')
          s = p.read_text()
          s = s.replace('import java.util.Comparator;\nimport java.util.HashSet;\nimport java.util.List;\nimport java.util.Set;\n', 'import java.util.Comparator;\nimport java.util.HashMap;\nimport java.util.HashSet;\nimport java.util.List;\nimport java.util.Map;\nimport java.util.Optional;\nimport java.util.Set;\n')
          s = s.replace('import com.mojang.blaze3d.pipeline.RenderPipeline;\nimport com.mojang.blaze3d.platform.DepthTestFunction;\nimport com.mojang.blaze3d.vertex.DefaultVertexFormat;\n', 'import com.mojang.blaze3d.GpuFormat;\nimport com.mojang.blaze3d.PrimitiveTopology;\nimport com.mojang.blaze3d.pipeline.ColorTargetState;\nimport com.mojang.blaze3d.pipeline.DepthStencilState;\nimport com.mojang.blaze3d.pipeline.RenderPipeline;\nimport com.mojang.blaze3d.platform.CompareOp;\nimport com.mojang.blaze3d.vertex.DefaultVertexFormat;\n')
          s = s.replace('import com.mojang.blaze3d.vertex.VertexFormat;\n', '')
          s = s.replace('import com.mojang.math.Axis;\n', 'import com.mojang.math.Axis;\nimport org.joml.Matrix4f;\nimport org.joml.Matrix4fc;\n')
          s = s.replace('import net.fabricmc.fabric.api.client.rendering.v1.level.LevelExtractionContext;\n', 'import net.fabricmc.fabric.api.client.renderer.v1.mesh.QuadEmitter;\nimport net.fabricmc.fabric.api.client.rendering.v1.level.LevelExtractionContext;\n')
          s = s.replace('import net.minecraft.client.renderer.OrderedSubmitNodeCollector;\n', 'import net.minecraft.client.Minecraft;\nimport net.minecraft.client.renderer.OrderedSubmitNodeCollector;\nimport net.minecraft.client.renderer.block.BlockAndTintGetter;\nimport net.minecraft.client.renderer.block.BlockModelRenderState;\nimport net.minecraft.client.renderer.block.dispatch.BlockStateModel;\n')
          s = s.replace('import net.minecraft.client.renderer.texture.OverlayTexture;\n', 'import net.minecraft.client.renderer.texture.OverlayTexture;\nimport net.minecraft.client.resources.model.geometry.BakedQuad;\n')
          s = s.replace('''    private static final RenderPipeline DEPTH_RESET_PIPELINE = RenderPipeline.builder(RenderPipelines.MATRICES_PROJECTION_SNIPPET)\n        .withLocation("pipeline/immersive_portals_client_depth_reset")\n        .withVertexShader("core/position")\n        .withFragmentShader("core/position")\n        .withDepthTestFunction(DepthTestFunction.NO_DEPTH_TEST)\n        .withDepthWrite(true)\n        .withColorWrite(false)\n        .withCull(false)\n        .withVertexFormat(DefaultVertexFormat.POSITION, VertexFormat.Mode.QUADS)\n        .build();\n''', '''    private static final RenderPipeline DEPTH_RESET_PIPELINE = RenderPipeline.builder(RenderPipelines.MATRICES_PROJECTION_SNIPPET)\n        .withLocation("pipeline/immersive_portals_client_depth_reset")\n        .withVertexShader("core/position")\n        .withFragmentShader("core/position")\n        .withDepthStencilState(new DepthStencilState(CompareOp.ALWAYS_PASS, true))\n        .withColorTargetState(new ColorTargetState(Optional.empty(), GpuFormat.RGBA8_UNORM, ColorTargetState.WRITE_NONE))\n        .withCull(false)\n        .withVertexBinding(0, DefaultVertexFormat.POSITION)\n        .withPrimitiveTopology(PrimitiveTopology.QUADS)\n        .build();\n''')
          s = s.replace('''    private record PreparedSample(\n        short dx,\n        short dy,\n        short dz,\n        int packedLight,\n        BlockState state\n    ) { }\n''', '''    private record PreparedSample(\n        short dx,\n        short dy,\n        short dz,\n        int packedLight,\n        BlockModelRenderState model\n    ) { }\n''')
          s = s.replace('    private static List<LearnedFrame> learnedFrames = List.of();\n', '    private static final Matrix4fc IDENTITY_MATRIX = new Matrix4f();\n    private static final Map<BlockState, BlockModelRenderState> MODEL_CACHE = new HashMap<>();\n    private static List<LearnedFrame> learnedFrames = List.of();\n')
          s = s.replace('''                prepared.add(new PreparedSample(\n                    sample.dx(), sample.dy(), sample.dz(), sample.packedLight(), sample.state()\n                ));\n''', '''                BlockModelRenderState model = modelFor(sample.state());\n                if (model == null) continue;\n                prepared.add(new PreparedSample(\n                    sample.dx(), sample.dy(), sample.dz(), sample.packedLight(), model\n                ));\n''')
          marker = '''    private static long sampleKey(int x, int y, int z) {\n        // Snapshot offsets stay well inside [-32, 32]. Biasing gives a compact collision-free key.\n        return ((long) (x + 64) << 16) | ((long) (y + 64) << 8) | (long) (z + 64);\n    }\n\n'''
          model_for = '''    private static BlockModelRenderState modelFor(BlockState state) {\n        BlockModelRenderState cached = MODEL_CACHE.get(state);\n        if (cached != null) return cached;\n\n        BlockStateModel model = Minecraft.getInstance().getModelManager().getBlockStateModelSet().get(state);\n        if (model == null) return null;\n\n        BlockModelRenderState renderState = new BlockModelRenderState();\n        QuadEmitter emitter = renderState.setupMesh(\n            IDENTITY_MATRIX,\n            model.hasMaterialFlag(BakedQuad.FLAG_TRANSLUCENT)\n        );\n\n        model.emitQuads(\n            emitter,\n            BlockAndTintGetter.EMPTY,\n            BlockPos.ZERO,\n            state,\n            renderState.scratchRandomSource(state.hashCode()),\n            direction -> false\n        );\n\n        MODEL_CACHE.put(state, renderState);\n        return renderState;\n    }\n\n'''
          if 'private static BlockModelRenderState modelFor' not in s:
              s = s.replace(marker, marker + model_for)
          s = s.replace('''            remoteCollector.submitBlock(\n                poseStack,\n                sample.state(),\n                sample.packedLight(),\n                OverlayTexture.NO_OVERLAY,\n                0\n            );\n''', '''            sample.model().submit(\n                poseStack,\n                remoteCollector,\n                sample.packedLight(),\n                OverlayTexture.NO_OVERLAY,\n                0\n            );\n''')
          p.write_text(s)
          PY
      - name: Build
        working-directory: immersive-portals-client
        run: gradle clean build --stacktrace
      - name: Show jars
        working-directory: immersive-portals-client
        run: find build/libs -maxdepth 1 -type f -name '*.jar' -print -exec sha256sum {} \;
      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: immersive-portals-client-26.2-alpha.4
          path: immersive-portals-client/build/libs/*.jar
          if-no-files-found: error
