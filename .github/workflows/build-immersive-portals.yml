name: Inspect Minecraft 26.2 rendering internals
on:
  push:
    branches:
      - build/immersive-portals-client-26.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Reconstruct alpha4 client-only source
        working-directory: immersive-portals-client
        run: |
          cat source-alpha4/part* | base64 -d > latest-alpha4.tar.xz
          echo "374c3576d6f049379c1ae2d0d1ba40fe93d8007b72956a72323d4c06ccfacbbc  latest-alpha4.tar.xz" | sha256sum -c -
          tar -xJf latest-alpha4.tar.xz
      - name: Inspect exact APIs
        working-directory: immersive-portals-client
        run: |
          cat >> build.gradle <<'EOF'
          tasks.register('dumpClientCp') {
              doLast { println sourceSets.client.compileClasspath.asPath }
          }
          EOF
          gradle -q dumpClientCp > /tmp/cp.txt
          CP=$(tail -n 1 /tmp/cp.txt)
          for C in \
            com.mojang.blaze3d.pipeline.DepthStencilState \
            com.mojang.blaze3d.pipeline.ColorTargetState \
            com.mojang.blaze3d.CompareFunction \
            com.mojang.blaze3d.vertex.DefaultVertexFormat \
            net.minecraft.client.renderer.block.BlockModelRenderState \
            net.minecraft.client.renderer.block.dispatch.BlockStateModelPart \
            net.minecraft.client.renderer.rendertype.RenderTypes \
            net.minecraft.client.renderer.rendertype.RenderSetup\$RenderSetupBuilder; do
            echo "===== $C ====="
            javap -classpath "$CP" -p -c "$C" || true
          done
