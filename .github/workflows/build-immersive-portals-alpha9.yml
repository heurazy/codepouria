name: Build Immersive Portals Client 26.2 alpha.9 Lunar
on:
  push:
    branches:
      - build/immersive-portals-client-26.2
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Restore alpha.8 sources
        working-directory: immersive-portals-client
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/ipc-a8 /tmp/ipc-a8-src
          mkdir -p /tmp/ipc-a8 /tmp/ipc-a8-src
          gh run download 33215546018 --repo heurazy/codepouria -n immersive-portals-client-26.2-alpha.8-lunar -D /tmp/ipc-a8
          SRC=$(find /tmp/ipc-a8 -maxdepth 1 -type f -name '*-sources.jar' | head -n 1)
          test -n "$SRC"
          unzip -q "$SRC" -d /tmp/ipc-a8-src
          rm -rf src/client/java src/main/resources
          mkdir -p src/client/java src/main/resources
          cp -R /tmp/ipc-a8-src/dev src/client/java/
          cp -R /tmp/ipc-a8-src/assets src/main/resources/
          cp /tmp/ipc-a8-src/fabric.mod.json src/main/resources/fabric.mod.json
          cp /tmp/ipc-a8-src/immersive_portals_client.accesswidener src/main/resources/immersive_portals_client.accesswidener
      - name: Fix per-face views and capture biome tints
        working-directory: immersive-portals-client
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/client/java/dev/immersiveportalsclient/state/PortalMemory.java')
          s = p.read_text()
          s = s.replace(
              'public record BlockSample(short dx, short dy, short dz, BlockState state, int packedLight) { }',
              'public record BlockSample(short dx, short dy, short dz, BlockState state, int packedLight, int tintColor) { }'
          )
          s = s.replace(
              '''    public record LearnedDestination(\n        PortalFrame source,\n        PortalFrame destinationPortal,\n        SceneSnapshot destinationScene\n    ) { }''',
              '''    public record LearnedDestination(\n        PortalFrame source,\n        PortalFrame destinationPortal,\n        SceneSnapshot destinationScene,\n        SceneSnapshot sourceScene\n    ) { }'''
          )
          s = s.replace(
              '            learn(pendingSource, canFinalize ? destinationPortal : null, scene);',
              '            learn(pendingSource, canFinalize ? destinationPortal : null, scene, pendingSourceScene);'
          )
          s = s.replace(
              '                learned.put(destinationPortal, new LearnedDestination(destinationPortal, pendingSource, pendingSourceScene));',
              '                learned.put(destinationPortal, new LearnedDestination(destinationPortal, pendingSource, pendingSourceScene, scene));'
          )
          s = s.replace(
              '''    private static void learn(PortalFrame source, PortalFrame destinationPortal, SceneSnapshot scene) {\n        learned.put(source, new LearnedDestination(source, destinationPortal, scene));\n    }''',
              '''    private static void learn(PortalFrame source, PortalFrame destinationPortal, SceneSnapshot scene, SceneSnapshot sourceScene) {\n        learned.put(source, new LearnedDestination(source, destinationPortal, scene, sourceScene));\n    }'''
          )
          old = '''                    int packedLight = LightCoordsUtil.pack(blockLight, skyLight);\n                    blocks.add(new BlockSample((short) dx, (short) dy, (short) dz, state, packedLight));'''
          new = '''                    int packedLight = LightCoordsUtil.pack(blockLight, skyLight);\n                    int tintColor = Minecraft.getInstance().getBlockColors().getColor(state, level, pos, 0);\n                    if (tintColor == -1) tintColor = 0xFFFFFFFF;\n                    else tintColor |= 0xFF000000;\n                    blocks.add(new BlockSample((short) dx, (short) dy, (short) dz, state, packedLight, tintColor));'''
          if old not in s:
              raise SystemExit('capture block not found')
          s = s.replace(old, new)
          p.write_text(s)
      - name: Fix renderer face selection, tint and source-world occlusion
        working-directory: immersive-portals-client
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/client/java/dev/immersiveportalsclient/render/PortalSurfaceRenderer.java')
          s = p.read_text()
          s = s.replace(
              'import net.minecraft.world.phys.AABB;\nimport net.minecraft.world.phys.Vec3;\n',
              'import net.minecraft.world.level.ClipContext;\nimport net.minecraft.world.phys.AABB;\nimport net.minecraft.world.phys.HitResult;\nimport net.minecraft.world.phys.Vec3;\n'
          )
          s = s.replace(
              '''    private record PreparedSample(\n        short dx,\n        short dy,\n        short dz,\n        int packedLight,\n        PreparedModel model\n    ) { }''',
              '''    private record PreparedSample(\n        short dx,\n        short dy,\n        short dz,\n        int packedLight,\n        int tintColor,\n        PreparedModel model\n    ) { }'''
          )
          s = s.replace(
              '''    private record LearnedFrame(\n        PortalFrame frame,\n        PortalFrame destinationPortal,\n        PortalMemory.SceneSnapshot scene,\n        List<PreparedSample> samples\n    ) { }''',
              '''    private record LearnedFrame(\n        PortalFrame frame,\n        PortalFrame destinationPortal,\n        PortalMemory.SceneSnapshot scene,\n        PortalMemory.SceneSnapshot sourceScene,\n        List<PreparedSample> samples\n    ) { }'''
          )
          old = '''        for (PortalFrame frame : PortalState.visiblePortals()) {\n            if (!frame.dimension().equals(context.level().dimension())) continue;'''
          new = '''        Vec3 camera = Minecraft.getInstance().player != null\n            ? Minecraft.getInstance().player.getEyePosition()\n            : Vec3.ZERO;\n\n        for (PortalFrame frame : PortalState.visiblePortals()) {\n            if (!frame.dimension().equals(context.level().dimension())) continue;\n            if (!hasClearPortalLineOfSight(context.level(), frame, camera)) continue;'''
          if old not in s:
              raise SystemExit('extract loop not found')
          s = s.replace(old, new)
          s = s.replace(
              '''                prepared.add(new PreparedSample(\n                    sample.dx(), sample.dy(), sample.dz(), sample.packedLight(), model\n                ));''',
              '''                prepared.add(new PreparedSample(\n                    sample.dx(), sample.dy(), sample.dz(), sample.packedLight(), sample.tintColor(), model\n                ));'''
          )
          s = s.replace(
              '''                destination.destinationPortal(),\n                scene,\n                List.copyOf(prepared)''',
              '''                destination.destinationPortal(),\n                scene,\n                destination.sourceScene(),\n                List.copyOf(prepared)'''
          )
          old = '''        double sourceBehindSign = sourceBehindSign(source, camera);\n        double destinationExitSign = destinationExitSign(destination, scene.yaw());'''
          new = '''        double sourceBehindSign = sourceBehindSign(source, camera);\n        double destinationExitSign = destinationExitSign(destination, scene.yaw());\n        PortalMemory.SceneSnapshot sourceScene = learned.sourceScene();\n        if (sourceScene != null && source.plane() != PortalFrame.Plane.HORIZONTAL) {\n            // Preserve the learned view on the face originally traversed, and flip to the opposite\n            // destination side when the same source portal is viewed from its opposite face.\n            double learnedSourceCameraSide = destinationExitSign(source, sourceScene.yaw());\n            double currentSourceCameraSide = -sourceBehindSign;\n            if (learnedSourceCameraSide * currentSourceCameraSide < 0.0) {\n                destinationExitSign = -destinationExitSign;\n            }\n        }'''
          if old not in s:
              raise SystemExit('destination sign block not found')
          s = s.replace(old, new)
          s = s.replace(
              '''                EMPTY_TINTS,\n                sample.packedLight(),''',
              '''                new int[] { sample.tintColor() },\n                sample.packedLight(),'''
          )
          marker = '''    private static boolean within(double value, double min, double max) {\n        return value >= min && value <= max;\n    }\n'''
          helper = '''    private static boolean hasClearPortalLineOfSight(\n        net.minecraft.client.multiplayer.ClientLevel level, PortalFrame frame, Vec3 camera\n    ) {\n        Vec3 target = frame.center();\n        Vec3 delta = target.subtract(camera);\n        double length = delta.length();\n        if (length < 0.15) return true;\n\n        // End just before the portal plane, otherwise the vanilla portal block itself can be the hit.\n        Vec3 end = target.subtract(delta.scale(0.08 / length));\n        HitResult hit = level.clip(new ClipContext(\n            camera, end, ClipContext.Block.VISUAL, ClipContext.Fluid.NONE, Minecraft.getInstance().player\n        ));\n        return hit.getType() == HitResult.Type.MISS\n            || hit.getLocation().distanceToSqr(camera) + 0.04 >= end.distanceToSqr(camera);\n    }\n\n''' + marker
          if marker not in s:
              raise SystemExit('within marker not found')
          s = s.replace(marker, helper)
          p.write_text(s)
          PY
      - name: Prepare standalone Lunar build
        working-directory: immersive-portals-client
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          props = Path('gradle.properties')
          text = re.sub(r'^mod_version=.*$', 'mod_version=0.2.5-alpha.9', props.read_text(), flags=re.M)
          props.write_text(text)

          gradle = Path('build.gradle')
          g = gradle.read_text()
          needle = '    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"\n'
          if 'include "net.fabricmc.fabric-api:fabric-api:' not in g:
              g = g.replace(needle, needle + '    include "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"\n')
          gradle.write_text(g)

          aw = Path('src/main/resources/immersive_portals_client.accesswidener')
          aw.write_text(aw.read_text().replace('accessWidener v2 named', 'accessWidener v2 official'))

          mod = Path('src/main/resources/fabric.mod.json')
          data = json.loads(mod.read_text())
          data['description'] = 'Lunar-compatible standalone client-only portal renderer: per-face destinations, captured biome tints and source-world occlusion.'
          data.get('depends', {}).pop('fabric-api', None)
          mod.write_text(json.dumps(data, indent=2) + '\n')
          PY
      - name: Build
        working-directory: immersive-portals-client
        run: gradle clean build --stacktrace
      - name: Verify
        working-directory: immersive-portals-client
        run: |
          JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)
          echo "Runtime JAR: $JAR"
          unzip -p "$JAR" fabric.mod.json
          echo '--- access widener ---'
          unzip -p "$JAR" immersive_portals_client.accesswidener | head -n 2
          sha256sum "$JAR"
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: immersive-portals-client-26.2-alpha.9-lunar
          path: immersive-portals-client/build/libs/*.jar
          if-no-files-found: error
