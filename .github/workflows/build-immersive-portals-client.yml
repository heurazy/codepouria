name: Build Immersive Portals Client 26.2

on:
  push:
    branches:
      - chatgpt/immersive-portals-client-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source archive
        shell: bash
        run: |
          cat tmp-immersive-portals-build/source.part0 \
              tmp-immersive-portals-build/source.part1 \
              tmp-immersive-portals-build/source.part2 \
              tmp-immersive-portals-build/source.part3 > source.zip.b64
          base64 -d source.zip.b64 > source.zip
          unzip -q source.zip

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build
        working-directory: ImmersivePortalsClient-26.2
        run: gradle clean build --stacktrace

      - name: Inspect jars
        run: ls -lh ImmersivePortalsClient-26.2/build/libs/

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: immersive-portals-client-26.2
          path: |
            ImmersivePortalsClient-26.2/build/libs/*.jar
            !ImmersivePortalsClient-26.2/build/libs/*-sources.jar
          if-no-files-found: error
